# Minimal Hyprlock layout matched to the ReGreet wallpaper and dark palette.
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/lock-wall.conf

general {
    grace = 1
}

background {
    monitor =
    path = $lock_wall
    blur_size = 7
    blur_passes = 2
    noise = 0.0117
    contrast = 1.05
    brightness = 0.72
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = Welcome back, $USER
    color = $on_surface
    font_size = 17
    font_family = Noto Sans
    position = 0, -160
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 82
    font_family = JetBrainsMono Nerd Font
    position = 0, -48
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $on_surface
    font_size = 16
    font_family = Noto Sans
    position = 0, 34
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.20
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fade_on_empty = false
    placeholder_text = <i>Enter password</i>
    hide_input = false
    rounding = 14
    font_family = Noto Sans
    position = 0, 132
    halign = center
    valign = center
}
