# cava config for the Quickshell music widget.
#
# cava taps the default output sink and prints one frame of bar values per
# line to stdout, e.g. "0;12;340;1000;...". Quickshell reads each line with a
# SplitParser and draws the bars inside the music capsule.
#
# Only run while music is playing (Quickshell starts/stops it automatically).

[general]
framerate = 60
bars = 14
autosens = 1
sensitivity = 100

[input]
# "pulse" works with both PulseAudio and PipeWire's pulse layer.
# If your cava was built with native PipeWire support you can use
# method = pipewire instead.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
# ASCII codes: 59 = ';' (bar separator), 10 = '\n' (frame separator)
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.77
